<!doctype html><meta charset="utf-8"><title>Vérification des écrans — ATOUT VIE</title><style>body{margin:0;background:#edf2f8;font:16px system-ui}header{padding:12px;display:flex;gap:15px;align-items:center}select{font-size:16px;padding:8px}#cadre{margin:8px auto;position:relative}iframe{border:0;position:absolute;left:0;top:0;transform-origin:top left;background:#071323}</style><header><label>Écran <select id="format" onchange="ajuster()"><option value="390,844">Téléphone 390 × 844</option><option value="320,568">Petit téléphone 320 × 568</option><option value="844,390">Téléphone paysage 844 × 390</option><option value="1366,768">Ordinateur 1366 × 768</option><option value="1920,1080">Télévision 1920 × 1080</option><option value="3840,2160">Télévision 4K 3840 × 2160</option></select></label><span id="bilan"></span></header><div id="cadre"><iframe id="jeu" title="ATOUT VIE" src="../?verification=ecrans"></iframe></div><script>function ajuster(){const [w,h]=format.value.split(',').map(Number),z=Math.min((innerWidth-30)/w,(innerHeight-90)/h,1);jeu.style.width=w+'px';jeu.style.height=h+'px';jeu.style.transform='scale('+z+')';cadre.style.width=w*z+'px';cadre.style.height=h*z+'px';}function verifier(){try{const d=jeu.contentDocument,a=d.getElementById('app'),r=a.getBoundingClientRect(),b=d.querySelector('.acces-jokers'),msg=d.querySelector('.msg');bilan.textContent=JSON.stringify({taille:[Math.round(r.width),Math.round(r.height)],debordement:d.documentElement.scrollHeight>jeu.clientHeight,boutonDansMessage:!!(b&&msg&&msg.contains(b))});}catch(e){}}jeu.addEventListener('load',()=>{ajuster();setInterval(verifier,1000)});window.onresize=ajuster;ajuster();</script>
