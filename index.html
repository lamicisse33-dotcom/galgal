function rendre(){
  if(P.mode==='table4')return rendre4();
  var ouvreur=P.initiative, jOuvre=(ouvreur===1);
  var dispo = (etape!=="pilier") ? []
            : (pilIA ? piliersRepondables(P,1,pilIA) : piliersOuvrables(P,1));
  // Armé depuis le tableau, le Fantôme ouvre TOUS les piliers ; sinon il ne
  // débloque que ceux dont tu n'as aucune carte.
  var fant = (etape!=="pilier") ? []
           : (fantomeArme ? PILIERS.slice() : piliersFantome(P,1));
  if(pilIA) fant=fant.filter(function(p){return p!==pilIA;});
  if(fantomeArme) dispo=[];

  // Les piliers sur lesquels le joueur peut poser MAINTENANT : c'est ce qui
  // rend une carte glissable, puisque sa cible existe.
  var jouables=jouablesMaintenant();

  var msg="";
  if(jokerArme) msg='<b>'+JOKERS_EFFET[jokerArme].nom+' armé</b> — il s’appliquera à la carte que tu vas poser.';
  if(msg){ }
  else if(etape==="pilier" && !pilIA)
    msg='🎯 <b>Tu ouvres.</b> Choisis ton pilier.';
  else if(etape==="pilier")
    msg='⚡ Elle a pris <b style="white-space:nowrap">'+pilIA+'.</b>'
      +'<br>Choisis un autre pilier — <i>aucune carte ne part avant.</i>';
  else if(etape==="poser" && cIA)
    msg='🎴 Elle a posé <b>face cachée</b> sur <b style="white-space:nowrap">'+pilIA+'.</b>'
      +'<br>Réponds avec une carte de <b style="white-space:nowrap">'+pilJ+'.</b>';
  else if(etape==="poser")
    msg='🎴 Les deux piliers sont pris.<br>Pose une carte de <b style="white-space:nowrap">'+pilJ+'.</b>';
  else if(etape==="verdict"){
    var gagne=dernier.gagnant===1;
    msg='<b style="font-size:15px">'+(gagne?"Tu remportes la manche":"Elle remporte la manche")+'</b>'
      +'<br><span style="white-space:nowrap">'+dernier["c1"].pts+' contre '+dernier["c2"].pts
      +' &nbsp;·&nbsp; <b>+'+dernier.butin+' pts</b></span>'
      +(dernier.bonus?'<br><b style="color:#F0D060">Équilibre des 4 piliers : +40 points !</b>':'')
      +(dernier.egalite?'<br><i style="font-size:11px">égalité — avantage à celui qui a ouvert</i>':'')
      +(function(){var g=dernier.gagnant===dernier.ouvreur?dernier['c'+dernier.ouvreur]:dernier['c'+(dernier.ouvreur===1?2:1)];
          return g&&g.cit?'<i class="cit">« '+g.cit+' »</i>':'';})()
      +(function(){
          var j=dernier.jokers||{}, nom=function(id){return JOKERS_EFFET[id]?JOKERS_EFFET[id].nom:id;};
          var t=[];
          if(j[1]) t.push("toi : "+nom(j[1]));
          if(j[2]) t.push("elle : "+nom(j[2]));
          if(!t.length) return "";
          var bloque="";
          if(dernier.protege){
            if(dernier.bloque && dernier.bloque[2]) bloque=" — ton bouclier a tenu"+(dernier.perdu&&dernier.perdu[2]?", son joker est brisé":", elle récupère son joker");
            if(dernier.bloque && dernier.bloque[1]) bloque=" — son bouclier a tenu"+(dernier.perdu&&dernier.perdu[1]?", ton joker est brisé":", tu récupères ton joker");
          }
          return '<br><span style="font-size:11px;color:#c9a0ff">🃏 '+t.join(" · ")+bloque+'</span>';
        })();
  }

  if(etape!=="verdict" && bouclierEngage(P,1))msg+='<br><small>🛡️ Protection : '+P.bouclier[1].restantes+' manche(s) restante(s)</small>';

  var h='<div class="entete"><div class="marque" id="titreJeu">ATOUT VIE <small>par KHALAM</small></div><button class="sonbtn" onclick="ouvrirReglages()" aria-label="Paramètres">⚙️</button></div><div class="bar">'
    +'<div class="sc"><div class="'+(P.s1>P.s2?"mene":"")+'"><span>TOI · piliers '+P.piliersGagnes[1].length+'/4</span><b>'+P.s1+'</b></div>'
    +'<div class="mid">'+Math.min(P.manche,P.total)+'/'+P.total+'<br><span style="font-size:8px;color:#8b8397">'+(P.donne?'☀️ '+libelleJour(P.donne)+' · ':'')+NIVEAUX[niveau]+' · pioche '+P.pioche.length+'</span></div>'
    +'<div class="'+(P.s2>P.s1?"mene":"")+'" style="align-items:flex-end"><span>ELLE · piliers '+P.piliersGagnes[2].length+'/4</span><b>'+P.s2+'</b></div></div></div>';

  h+='<div class="mat"><div class="rang">';
  PILIERS.forEach(function(p){
    // Elle a ouvert, donc elle a posé la première : sa carte est visible.
    // Au verdict, les deux cartes ont rejoint la pile : les emplacements se vident.
    // Sa carte se pose de DOS et n'est retournée qu'au verdict, une fois les
    // deux cartes jouées.
    var posee=(pilIA===p&&cIA);
    var face =(posee&&etape==="verdict");
    h+='<div class="slot'+(posee?" on":"")+(face?" revele":"")+'" data-p="'+p+'">'
      +pileHTML(plisVisibles(p,2),2)
      +(posee?'<div class="dessus">'+(face?carteHTML(cIA):dosHTML())+'</div>':"")+'</div>';
  });
  h+='</div><div class="medrang">';
  PILIERS.forEach(function(p){
    var k=CLE[p], can=dispo.indexOf(p)>=0, canF=fant.indexOf(p)>=0;
    var on=(pilJ===p||pilIA===p);
    var cls="med"+(can||canF?" can":"")+(on?" on":"")+((!can&&!canF&&!on)?" off":"")
      +(pilIA===p?" ia":"");   // c'est le clignotement qui désigne son pilier
    var clic=can?'choisirPilier(\''+p+'\')':(canF?'jouerFantomeSur(\''+p+'\')':'');
    h+='<div class="'+cls+'" data-p="'+p+'" style="--acc:'+(pilJ===p?"#F0D060":"#e05555")+'">'
      +'<div class="rond e-'+k+'"'+(clic?' onclick="'+clic+'"':'')+'></div>'
      +'<div class="nb" style="color:'+(canF&&!can?"#c9a0ff":"#8b8397")+'">'
      +(canF&&!can?"👻 Fantôme":(pilJ===p?"TOI":(pilIA===p?"ELLE":(function(){
          var n=P.mains[1].filter(function(c){return c.pilier===p;}).length;
          return n?n+" carte"+(n>1?"s":""):"";})())))+'</div>'
      
      +'</div>';
  });
  h+='</div><div class="rang mienne">';
  PILIERS.forEach(function(p){
    // Ta carte est la tienne : tu la vois dès que tu l'as posée. C'est
    // l'ADVERSAIRE qui ne doit pas la voir avant d'avoir joué la sienne —
    // ce qui comptera le jour où deux joueurs partageront un écran.
    var mienne=(pilJ===p&&cJ);
    var faceM = mienne;
    var cible=(jouables.indexOf(p)>=0);
    // La pile du pilier occupe l'emplacement, à la taille d'une vraie carte.
    // La carte que tu poses arrive PAR-DESSUS.
    h+='<div class="slot'+(pilJ===p?" on":"")+(cible?" cible":"")+(faceM?" revele":"")+'" data-p="'+p+'">'
      +pileHTML(plisVisibles(p,1),1)
      +(mienne?'<div class="dessus">'+(faceM?carteHTML(cJ):dosHTML())+'</div>':"")+'</div>';
  });
  h+='</div></div>';

  h+='<div class="msg"><div class="msg-content">'+msg+'</div></div>';

  // La main guide le choix du pilier : pendant le choix elle est ENTIÈREMENT
  // lisible. Une fois le pilier choisi, seules ses cartes restent, agrandies
  // pour remplir la bande — les autres s'effacent.
  var choixEnCours=(etape==="pilier");
  var aMontrer=(etape==="poser")
    ? P.mains[1].filter(function(c){return c.pilier===pilJ;})
    : P.mains[1];
  /* LA MAIN NE CHANGE JAMAIS DE HAUTEUR.
     Au repos : cinq colonnes, deux rangées. Une fois le pilier choisi : une
     seule rangée, et les cartes occupent toute la hauteur des deux — donc
     deux fois plus grandes, sans que la bande ne bouge d'un pixel. */
  var largeurMain = Math.min(window.innerWidth||390, 520) - 20 - 2;
  var carteL = largeurMain/5, carteH = carteL*1.4182;
  var hautMain = Math.round(2*carteH + 6 + 12);       // 2 rangées + écart + marge
  var zoom = (etape==="poser");
  var cols=5, rangs=2, largeurCarte=0;
  if(zoom){
    /* On essaie une rangée, puis deux, et on garde la disposition qui donne
       la PLUS GRANDE carte. Sur cinq cartes, une seule rangée les rendait
       plus petites qu'au repos : deux rangées valent mieux. */
    var n=Math.max(1,aMontrer.length), dispo=hautMain-12, meilleur=0;
    largeurCarte=0;
    [1,2].forEach(function(r){
      var c=Math.ceil(n/r);
      var colL=(largeurMain-8*(c-1))/c;
      var L=Math.min((dispo-(r-1)*8)/r/1.4182, colL);
      if(L>meilleur){ meilleur=L; cols=c; rangs=r; largeurCarte=L; }
    });
  }
  // En mode agrandi, on impose la LARGEUR des colonnes — celle qu'on vient de
  // calculer — et la hauteur des cartes en découle par leur rapport. Avec des
  // colonnes en «1fr», la carte subissait deux contraintes et s'étirait.
  var colonnes = zoom
    ? "repeat("+cols+","+Math.floor(largeurCarte)+"px)"
    : "repeat("+cols+",1fr)";
  h+='<div class="main'+(zoom?" zoom":"")+'" style="height:'+hautMain+'px;'
    +'grid-template-rows:repeat('+rangs+',1fr);'
    +(zoom?'justify-content:center;align-content:center;':'')
    +'grid-template-columns:'+colonnes+'">';
  aMontrer.forEach(function(c){
    var jouable=(jouables.indexOf(c.pilier)>=0);
    h+='<div class="k'+(jouable?" go":" lisible")+(sel===c.id?" leve":"")+'"'
      +' data-id="'+c.id+'" data-p="'+c.pilier+'">'+carteHTML(c)+'</div>';
  });
  h+='</div>';
  h+=tableauHTML()+reglagesHTML()+aideHTML()+statsHTML()+palmaresHTML()+guideHTML();
  document.getElementById("app").innerHTML=h;
  // Rien d'un geste précédent ne survit à un rendu : ni carte restée soulevée,
  // ni carte volante orpheline. Sans ça, une carte peut rester figée en grand
  // par-dessus le verdict si le doigt s'est levé hors de l'écran.
  balayage=false; souleves=[];
  var sales=document.querySelectorAll(".k.loupe,.k.retombe,.k.prise");
  for(var q=0;q<sales.length;q++){
    sales[q].classList.remove("loupe");
    sales[q].classList.remove("retombe");
    sales[q].classList.remove("prise");
  }
  if(!drag){
    var vols=document.querySelectorAll("#vol");
    for(var q2=0;q2<vols.length;q2++) vols[q2].parentNode.removeChild(vols[q2]);
  }
  volIA();
  volAimant();
  // Sa carte se retourne au verdict : un son, une seule fois par manche.
  if(etape==="verdict" && dernier && retourneFait!==dernier.manche){
    retourneFait=dernier.manche; AUDIO.retourne();
  }
  enchainer();
}

/* Une gerbe : elle éclate en étoile depuis un point du ciel. */
var cielTimer=null;
function gerbe(x,y,couleur){
  var ciel=document.getElementById("ciel");
  if(!ciel) return;
  for(var i=0;i<26;i++){
    var p=document.createElement("i");
    var a=(Math.PI*2*i)/26 + Math.random()*0.2, r=70+Math.random()*90;
    p.style.left=x+"px"; p.style.top=y+"px"; p.style.color=couleur;
    p.style.background=couleur;
    p.style.setProperty("--dx",(Math.cos(a)*r).toFixed(1)+"px");
    p.style.setProperty("--dy",(Math.sin(a)*r+40).toFixed(1)+"px");
    p.style.animation="gerbe "+(900+Math.random()*500)+"ms cubic-bezier(.15,.6,.3,1) forwards";
    ciel.appendChild(p);
    setTimeout(function(n){return function(){ n.remove(); };}(p),1500);
  }
  AUDIO.gerbe();
}

function lancerFeux(){
  var couleurs=["#F0D060","#E74C3C","#27AE60","#9B59B6"];
  clearInterval(cielTimer);
  var n=0;
  cielTimer=setInterval(function(){
    if(!document.getElementById("ciel")){ clearInterval(cielTimer); return; }
    gerbe(60+Math.random()*(window.innerWidth-120),
          70+Math.random()*(window.innerHeight*0.45),
          couleurs[n++%4]);
  },620);
}

/* ═══ LE TABLEAU DE BORD ═══════════════════════════════════════════════
   Les mêmes indicateurs que l'écran Statistiques du jeu : parties, taux de
   victoire, meilleur score, série en cours et meilleure série, répartition
   par pilier. Conservé d'une session à l'autre. */
var STATS = (function(){
  var vide={parties:0,victoires:0,defaites:0,egalites:0,meilleurScore:0,
            serie:0,meilleureSerie:0,piliers:{}};
  function lire(){
    try{ var b=localStorage.getItem("galgal_stats");
         return b? Object.assign({},vide,JSON.parse(b)) : Object.assign({},vide); }
    catch(e){ return Object.assign({},vide); }
  }
  var st=lire();
  function ecrire(){ try{ localStorage.setItem("galgal_stats",JSON.stringify(st)); }catch(e){} }
  return {
    etat:function(){ return st; },
    finPartie:function(s1,s2,plis){
      st.parties++;
      if(s1>s2){ st.victoires++; st.serie++; if(st.serie>st.meilleureSerie) st.meilleureSerie=st.serie; }
      else if(s1<s2){ st.defaites++; st.serie=0; }
      else { st.egalites++; }
      if(s1>st.meilleurScore) st.meilleurScore=s1;
      Object.keys(plis).forEach(function(p){
        var n=plis[p].filter(function(c){return c.gagnePar===1||c.gagnePar==='nous';}).length;
        if(n) st.piliers[p]=(st.piliers[p]||0)+n;
      });
      ecrire();
    },
    remettre:function(){ st=Object.assign({},vide,{piliers:{}}); ecrire(); }
  };
})();

/* Verrou d'interface locale, identique à l'accès privé des Quatre Dames.
   Les statistiques restent sur l'appareil : ce verrou ne remplace pas une protection serveur. */
var ACCES_PRIVE=(function(){
  var autorise=false, essais=0, attente=0;
  return {ouvert:function(){return autorise;}, fermer:function(){autorise=false;},
    valider:function(code){
      if(Date.now()<attente) return false;
      var h=5381;for(var i=0;i<code.length;i++)h=((h*33)^code.charCodeAt(i))>>>0;
      autorise=h===223692748;
      if(autorise) essais=0;
      else if(++essais>=3){attente=Date.now()+30000;essais=0;}
      return autorise;
    }};
})();
function fermerAccesPrive(){document.getElementById('accesPrive').hidden=true;document.getElementById('codePrive').value='';}
function validerAccesPrive(e){
  e.preventDefault();var champ=document.getElementById('codePrive');
  var ok=ACCES_PRIVE.valider(champ.value);champ.value='';
  if(ok){fermerAccesPrive();ouvrirStats();}
  else document.getElementById('erreurPrive').textContent='Code refusé. Après trois essais, attends 30 secondes.';
}
var appuiPrive=null;
function annulerAppuiPrive(){clearTimeout(appuiPrive);appuiPrive=null;}
document.addEventListener('pointerdown',function(e){
  if(!e.target.closest || !e.target.closest('#titreJeu'))return;
  annulerAppuiPrive();appuiPrive=setTimeout(function(){
    document.getElementById('erreurPrive').textContent='';
    document.getElementById('accesPrive').hidden=false;
    document.getElementById('codePrive').focus();
  },2000);
});
['pointerup','pointercancel','pointermove'].forEach(function(t){document.addEventListener(t,annulerAppuiPrive);});

  if(!palmaresOuvert)return "";
  var st=STATS.etat(), n=st.parties||0, taux=n?Math.round((st.victoires||0)/n*100):0, d=resultatDuJour();
  var maxP=0,favoris=[];PILIERS.forEach(function(p){var v=st.piliers[p]||0;if(v>maxP){maxP=v;favoris=[p];}else if(v===maxP&&v>0)favoris.push(p);});
  function ligne(l,v){return '<div class="stl"><span>'+l+'</span><b>'+v+'</b></div>';}
  return '<div class="voile"><div class="tableau"><h3>MON PALMARÈS</h3>'
    +(n===0?'<div class="note">Termine une partie et elle s’inscrit ici.</div>':'')
    +ligne("Parties jouées",n)+ligne("Victoires",(st.victoires||0)+" · "+taux+" %")
    +ligne("Meilleur score",st.meilleurScore||0)+ligne("Série en cours",st.serie||0)+ligne("Meilleure série",st.meilleureSerie||0)
    +ligne("Pilier favori",favoris.length?favoris.join(", "):"—")
    +ligne("Donne du jour",d?d.s1+' – '+d.s2+(d.s1>d.s2?' ✓':''):'pas encore jouée')
    +'<div class="note">Ces chiffres restent sur ton téléphone.</div>'
    +'<button class="fermer" onclick="palmaresOuvert=false;ouvrirReglages()">Retour aux paramètres</button></div></div>';
}

var statsOuvertes=false;
function ouvrirStats(){ if(!ACCES_PRIVE.ouvert()) return; reglagesOuverts=false; statsOuvertes=true; rendre(); }
function fermerStats(){ statsOuvertes=false; ACCES_PRIVE.fermer(); rendre(); }
function viderStats(){ if(!ACCES_PRIVE.ouvert()) return; STATS.remettre(); rendre(); }

function statsHTML(){
  if(!statsOuvertes || !ACCES_PRIVE.ouvert()) return "";
  var st=STATS.etat(), n=st.parties||0;
  var taux=n?Math.round((st.victoires||0)/n*100):0;
  var total=0; PILIERS.forEach(function(p){ total+=st.piliers[p]||0; });
  var maxP=0, favoris=[];
  PILIERS.forEach(function(p){ var v=st.piliers[p]||0; if(v>maxP){ maxP=v; favoris=[p]; }
                               else if(v===maxP && v>0) favoris.push(p); });
  function ligne(l,v){ return '<div class="stl"><span>'+l+'</span><b>'+v+'</b></div>'; }
  var barres=PILIERS.map(function(p){
    var v=st.piliers[p]||0, pc=total?Math.round(v/total*100):0;
    return '<div class="barre-p"><span class="lab">'+p+'</span>'
      +'<span class="jauge"><i style="width:'+pc+'%;background:'+TEINTE[p]+'"></i></span>'
      +'<span class="val">'+v+'</span></div>';
  }).join("");
  return '<div class="voile"><div class="tableau">'
    +'<h3>TABLEAU DE BORD</h3>'
    +(n===0 ? '<div class="note">Aucune partie terminée pour l’instant.</div>' : '')
    +ligne("Parties jouées", n)
    +ligne("Victoires", (st.victoires||0)+"  ·  "+taux+" %")
    +ligne("Défaites", st.defaites||0)
    +ligne("Égalités", st.egalites||0)
    +ligne("Meilleur score", st.meilleurScore||0)
    +ligne("Série en cours", st.serie||0)
    +ligne("Meilleure série", st.meilleureSerie||0)
    +ligne("Pilier favori", favoris.length?favoris.join(", "):"—")
    +'<div class="note">Cartes remportées par pilier</div>'+barres
    +'<button class="fermer" onclick="viderStats()">Remettre à zéro</button>'
    +'<button class="fermer" onclick="fermerStats()">Fermer</button>'
    +'</div></div>';
}

function rendreFin(){
  if(P.mode==='table4')return rendreFin4();
  var gagne=P.s1>P.s2, nul=P.s1===P.s2;
  if(!P._compte){ P._compte=true; STATS.finPartie(P.s1,P.s2,P.plis);
    if(P.donne){try{localStorage.setItem('atoutvie_donne',JSON.stringify({jour:P.donne,s1:P.s1,s2:P.s2}));}catch(e){}} }
  oublierPartie();
  MUSIQUE.arrete();
  if(gagne||nul){ AUDIO.fanfare(); }
  document.getElementById("app").innerHTML=
    '<div id="ciel"></div>'
    +'<div class="fin"><div class="titre">'
      +(nul?"ÉGALITÉ":(gagne?"VICTOIRE":"DÉFAITE"))+'</div>'
    +'<div class="score">'+P.s1+' <span style="opacity:.4">—</span> '+P.s2+'</div>'
    +(P.donne?'<div class="donne">☀️ DONNE DU '+libelleJour(P.donne).toUpperCase()+'</div>':'')
    +'<p style="color:#8b8397;font-size:12px">'+P.total+' manches · '
    +Object.keys(P.plis).map(function(p){return p+" "+P.plis[p].length;}).join(" · ")+'</p>'
    +'<div class="bilan">'+Object.keys(P.plis).map(function(p){
        if(!P.plis[p].length) return "";
        var mien=P.plis[p].filter(function(c){return c.gagnePar===1;});
        var sien=P.plis[p].filter(function(c){return c.gagnePar===2;});
        return '<div class="col"><div class="tit">'+p+' — toi '+mien.length+' · elle '+sien.length+'</div><div class="lot">'
          +P.plis[p].map(function(c){return '<div class="mini">'+carteHTML(c)+'</div>';}).join("")
          +'</div></div>';
      }).join("")+'</div>'
    +'<p>Bonus Équilibre : toi '+(P.bonusEquilibre[1]?'+40':'0')+' · elle '+(P.bonusEquilibre[2]?'+40':'0')+'</p>'
    +'<div class="actions"><button class="act" onclick="neuf()">Rejouer</button>'
    +'<button class="act" onclick="partager()">Partager</button>'
    +(P.donne?'':'<button class="act" onclick="donneDuJour()">☀️ Donne du jour</button>')+'</div></div>';
  if(gagne||nul) lancerFeux();
}
function toast(t){var e=document.getElementById('toast');if(e)e.remove();e=document.createElement('div');e.id='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove();},2700);}
function textePartage(){
  var a=P.mode==='table4'?P.scores.nous:P.s1, b=P.mode==='table4'?P.scores.eux:P.s2;
  var issue=a>b?'Victoire':(a<b?'Défaite':'Égalité');
  var quoi=(P.donne?'Donne du '+libelleJour(P.donne):(P.mode==='table4'?'Table à 4':'Duel contre la '+NIVEAUX[niveau]));
  return 'ATOUT VIE — '+quoi+' : '+issue+' '+a+' – '+b+'. Et toi ?';
}
function partager(){
  var texte=textePartage(), url='https://galgal.khalam.app/';
  if(navigator.share){navigator.share({title:'ATOUT VIE',text:texte,url:url}).catch(function(){});return;}
  var tout=texte+' '+url;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tout).then(function(){toast('Copié — colle-le où tu veux.');},function(){toast(tout);});}
  else toast(tout);
}
// Si quoi que ce soit échoue au démarrage, on l'affiche : une page morte
// n'apprend rien, un message dit quoi corriger.
/* ═══ INSTALLATION ET MISES À JOUR ═════════════════════════════════════
   Le service worker rend le jeu installable et jouable hors ligne. Quand
   une nouvelle version est déposée, il l'installe en arrière-plan et ATTEND :
   la bannière propose au joueur de l'appliquer. On ne recharge jamais
   quelqu'un en pleine partie. */
/* ── S'INSTALLER SUR LE TÉLÉPHONE ─────────────────────────────────────────

   Demandé par Lamine le 10 septembre 2026 : les applications de KHALAM ne
   passent pas par les magasins, elles s'installent depuis le site. Encore
   faut-il que les gens le sachent — et le geste n'est pas le même selon le
   téléphone.

   ANDROID prévient qu'il peut installer : on retient sa proposition et on la
   ressort sur un vrai bouton. Sans ça, il faut aller chercher « Ajouter à
   l'écran d'accueil » dans un menu du navigateur, et presque personne ne le
   fait.

   IPHONE ne prévient jamais, et aucun code n'y changera rien : Apple ne
   donne pas ce signal aux sites. La seule chose possible est d'ÉCRIRE LE
   GESTE — Partager, puis « Sur l'écran d'accueil ». Sans cette phrase,
   personne ne devine.

   Dans les deux cas, rien ne s'affiche si le jeu est déjà posé sur l'écran
   d'accueil, ni si on a répondu non une fois. */
var invitation=null;

function dejaPosee(){
  try{ if(window.matchMedia('(display-mode: standalone)').matches) return true; }catch(e){}
  return navigator.standalone===true;
}
function ecartee(){
  try{ return localStorage.getItem('galgal.poser')==='non'; }catch(e){ return false; }
}
function surIphone(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent)
    || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function proposerDePoser(mot){
  if(dejaPosee() || ecartee()) return;
  var b=document.getElementById('poser');
  if(!b || b.style.display==='flex') return;
  if(mot) document.getElementById('poser-mot').textContent=mot;
  // Sur iPhone il n'y a rien à déclencher : le bouton « Installer » n'aurait
  // aucun effet, et un bouton qui ne fait rien est pire que pas de bouton.
  document.getElementById('poser-oui').hidden=!invitation;
  b.style.display='flex';
}
document.getElementById('poser-oui').onclick=function(){
  document.getElementById('poser').style.display='none';
  if(!invitation) return;
  try{ invitation.prompt(); }catch(e){}
  invitation=null;
};
document.getElementById('poser-non').onclick=function(){
  document.getElementById('poser').style.display='none';
  try{ localStorage.setItem('galgal.poser','non'); }catch(e){}
};
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  invitation=e;
  proposerDePoser('Installe ATOUT VIE sur ton téléphone.');
});
window.addEventListener('appinstalled',function(){
  var b=document.getElementById('poser'); if(b) b.style.display='none';
});
/* L'iPhone ne prévient jamais : on laisse le jeu s'afficher, puis on écrit
   le geste. Le délai évite de parler par-dessus l'arrivée. */
if(surIphone()){
  setTimeout(function(){
    proposerDePoser('Sur iPhone : appuie sur Partager, puis « Sur l\'écran d\'accueil ».');
  },2500);
}

var swEnAttente=null;
function appliquerMaj(){
  if(swEnAttente){ swEnAttente.postMessage({type:"SKIP_WAITING"}); }
  else { location.reload(); }
}
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    function guette(w){
      if(!w) return;
      w.addEventListener("statechange",function(){
        if(w.state==="installed" && navigator.serviceWorker.controller){
          swEnAttente=w;
          var b=document.getElementById("maj"); if(b) b.style.display="flex";
          // Les deux occupent le même bas d'écran : la correction passe devant.
          var i=document.getElementById("poser"); if(i) i.style.display="none";
        }
      });
    }
    if(reg.waiting){ swEnAttente=reg.waiting;
      var b=document.getElementById("maj"); if(b) b.style.display="flex";
      var i=document.getElementById("poser"); if(i) i.style.display="none"; }
    guette(reg.installing);
    reg.addEventListener("updatefound",function(){ guette(reg.installing); });
    // On redemande au serveur à chaque retour dans le jeu.
    document.addEventListener("visibilitychange",function(){
      if(!document.hidden) reg.update();
    });
  }).catch(function(){});
  var recharge=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(recharge) return; recharge=true; location.reload();
  });
}

try{ var reprise=reprendrePartie(); neuf(reprise?{reprise:reprise}:null); if(reprise && reprise.historique.length) toast('Partie reprise — manche '+Math.min(reprise.manche,reprise.total)+'/'+reprise.total); }
catch(err){
  document.getElementById("app").innerHTML=
    '<div style="padding:40px 18px;text-align:center">'
    +'<div style="font-family:Cinzel,serif;color:#F0D060;font-size:14px;letter-spacing:2px">ATOUT VIE</div>'
    +'<div style="color:#e05555;font-size:13px;margin:14px 0 6px">Le jeu ne démarre pas.</div>'
    +'<div style="color:#8b8397;font-size:11px;word-break:break-word">'+(err&&err.message?err.message:err)+'</div>'
    +'</div>';
}
window.addEventListener("error",function(e){
  // Une erreur en cours de partie ne doit pas rester invisible : bandeau
  // discret, la partie continue.
  try{
    var a0=document.getElementById("app");
    if(a0 && a0.querySelector(".mat")){
      var b=document.getElementById("alerte");
      if(!b){ b=document.createElement("div"); b.id="alerte"; document.body.appendChild(b); }
      b.textContent="⚠ "+(e.message||"erreur")+(e.lineno?" (ligne "+e.lineno+")":"");
      return;
    }
  }catch(_){}

  var a=document.getElementById("app");
  if(a && !a.querySelector(".mat") && !/ne démarre pas/.test(a.textContent))
    a.innerHTML='<div style="padding:40px 18px;text-align:center;color:#e05555;font-size:12px">'
      +'Erreur : '+(e.message||"inconnue")+'</div>';
});
